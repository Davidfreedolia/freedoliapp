<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freedoliapp</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
      </span>
      <span class="brand__name">Freedoliapp</span>
    </div>
    <a class="header__link" href="https://freedoliapp.com/app" target="_blank" rel="noopener noreferrer">Obrir app</a>
  </header>

  <main class="main">
    <!-- State: Amazon product page detected -->
    <section id="state-product" class="state" hidden>
      <p class="kicker">ASIN detectat</p>
      <div class="asin-row">
        <code id="asin-value" class="asin"></code>
        <span id="marketplace-value" class="chip"></span>
      </div>
      <p id="title-value" class="title"></p>
      <p id="price-value" class="price" hidden></p>

      <div class="actions">
        <button id="btn-research" type="button" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Investigar amb IA
        </button>
        <button id="btn-project" type="button" class="btn btn-secondary">
          Crear projecte
        </button>
      </div>
    </section>

    <!-- State: not on Amazon product page -->
    <section id="state-empty" class="state" hidden>
      <p class="kicker">Sense ASIN detectat</p>
      <p class="empty-body">
        Obre una pàgina de producte d'Amazon (qualsevol marketplace) i tornaràs a veure aquí l'acció ràpida d'enviar-lo a Freedoliapp.
      </p>
      <a class="btn btn-secondary btn-block" href="https://freedoliapp.com/app/research" target="_blank" rel="noopener noreferrer">
        Iniciar recerca manual
      </a>
    </section>
  </main>

  <footer class="footer">
    <a href="https://freedoliapp.com" target="_blank" rel="noopener noreferrer">freedoliapp.com</a>
    <span class="footer__version" id="version"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
